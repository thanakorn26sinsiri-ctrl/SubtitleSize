name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Get AML headers
        run: |
          git clone --depth 1 https://github.com/RusJJ/AndroidModLoader.git aml
          mkdir -p jni/mod
          cp $(dirname $(find aml -name amlmod.h | head -n 1))/*.h jni/mod/
      - run: $ANDROID_NDK_HOME/ndk-build NDK_PROJECT_PATH=. APP_BUILD_SCRIPT=jni/Android.mk NDK_APPLICATION_MK=jni/Application.mk
      - uses: actions/upload-artifact@v4
        with:
          name: mod
          path: libs/armeabi-v7a/*.so
